name: Publish Container Images

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-container-images
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify source commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify tagged source and required checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-source.js

  publish:
    name: Publish signed release pair
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Build both candidate images
        id: candidates
        run: |
          set -Eeuo pipefail
          bash scripts/build-container-candidate.sh backend ./backend
          bash scripts/build-container-candidate.sh frontend ./frontend --build-arg VITE_API_URL= --build-arg VITE_MCP_API_URL=

      - name: Scan both exact candidate digests
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          for reference in \
            "${{ steps.candidates.outputs.backend_reference }}" \
            "${{ steps.candidates.outputs.frontend_reference }}"; do
            docker run --rm \
              -e TRIVY_USERNAME \
              -e TRIVY_PASSWORD \
              aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${reference}"
          done

      - name: Sign and attest both candidate digests
        run: |
          set -Eeuo pipefail
          predicate="${RUNNER_TEMP}/release-source.json"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg workflow ".github/workflows/publish-images.yml" \
            --arg ref "${GITHUB_REF}" \
            '{repository: $repository, commit: $commit, workflow: $workflow, ref: $ref}' > "${predicate}"
          for reference in \
            "${{ steps.candidates.outputs.backend_reference }}" \
            "${{ steps.candidates.outputs.frontend_reference }}"; do
            cosign sign --yes "${reference}"
            cosign attest --yes \
              --type https://aipermission.dev/attestations/release-source/v1 \
              --predicate "${predicate}" \
              "${reference}"
          done

      - name: Promote signed pair with rollback
        env:
          BACKEND_DIGEST: ${{ steps.candidates.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.candidates.outputs.frontend_digest }}
        run: bash scripts/promote-container-images.sh
