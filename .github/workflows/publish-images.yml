name: Publish Container Images

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare tags
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Publish backend image
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(
            --tag "ghcr.io/aipermission/aipermission-backend:${{ steps.meta.outputs.tag }}"
            --tag "ghcr.io/aipermission/aipermission-backend:${version}"
          )
          if [[ "${version}" != *-* ]]; then
            tags+=(--tag "ghcr.io/aipermission/aipermission-backend:latest")
          fi
          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file /tmp/backend-image-metadata.json \
            "${tags[@]}" \
            --push \
            ./backend

      - name: Sign backend image digest
        run: |
          digest="$(jq -r '."containerimage.digest"' /tmp/backend-image-metadata.json)"
          test "${digest#sha256:}" != "${digest}"
          cosign sign --yes "ghcr.io/aipermission/aipermission-backend@${digest}"

      - name: Publish frontend image
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(
            --tag "ghcr.io/aipermission/aipermission-frontend:${{ steps.meta.outputs.tag }}"
            --tag "ghcr.io/aipermission/aipermission-frontend:${version}"
          )
          if [[ "${version}" != *-* ]]; then
            tags+=(--tag "ghcr.io/aipermission/aipermission-frontend:latest")
          fi
          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file /tmp/frontend-image-metadata.json \
            --build-arg VITE_API_URL="" \
            --build-arg VITE_MCP_API_URL="" \
            "${tags[@]}" \
            --push \
            ./frontend

      - name: Sign frontend image digest
        run: |
          digest="$(jq -r '."containerimage.digest"' /tmp/frontend-image-metadata.json)"
          test "${digest#sha256:}" != "${digest}"
          cosign sign --yes "ghcr.io/aipermission/aipermission-frontend@${digest}"
