name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  security-hygiene:
    name: Security Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install repository verification dependencies
        run: npm ci --prefix scripts --workspaces=false
      - name: Secret scan
        run: node scripts/secret-scan.js
      - name: Repository history secret scan
        run: sh scripts/gitleaks-history-scan.sh
      - name: Line ending check
        run: node scripts/line-ending-check.js
      - name: Markdown link tests
        run: node scripts/markdown-link-check.test.js
      - name: Markdown links
        run: node scripts/markdown-link-check.js
      - name: Go toolchain consistency
        run: node scripts/go-toolchain-check.js
      - name: Verification workflow contracts
        run: node scripts/verification-policy.js --verify-workflows
      - name: Verification policy ratchet
        run: node scripts/verification-policy.js --verify-ratchet
      - name: Maintenance budget tests
        run: node --test scripts/maintenance-budget-check.test.js
      - name: CI workflow tests
        run: node --test scripts/ci-workflow.test.js
      - name: Bounded fuzz runner tests
        run: node --test scripts/run-bounded-fuzz.test.js
      - name: Trusted Git base tests
        run: node --test scripts/trusted-git-base.test.js
      - name: Maintenance budgets
        run: node scripts/maintenance-budget-check.js
      - name: Generated MCP client catalog
        run: node scripts/mcp-client-catalog.mjs --check
      - name: Generated connector catalog
        run: node scripts/connector-catalog.js --check
      - name: Maintenance budget ratchet tests
        run: node --test scripts/maintenance-source-kind.test.js scripts/maintenance-budget-ratchet.test.js
      - name: Maintenance budget ratchet
        run: node scripts/maintenance-budget-ratchet.js
      - name: Package lock ownership
        run: node scripts/package-lock-check.js
      - name: Compose topology tests
        run: node --test scripts/compose-topology.test.js
      - name: Image publishing workflow tests
        run: node --test scripts/publish-images-workflow.test.js
      - name: Release version tests
        run: node --test scripts/release-version.test.js
      - name: Release provenance tests
        run: node --test scripts/verify-release-source.test.js
      - name: Release version consistency
        run: node scripts/release-version.js --check
      - name: Native dependency inventory
        run: node scripts/native-dependency-check.js

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - uses: ./.github/actions/setup-backend-native
      - name: Test with coverage
        working-directory: backend
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1
      - name: Coverage floors
        working-directory: backend
        run: go run ./cmd/coveragecheck -profile coverage.out
      - name: Function budgets
        working-directory: backend
        run: go run ./cmd/function-budget
      - name: Recovery drill
        run: make recovery-drill
      - name: Bounded security fuzzing
        run: make bounded-fuzz
      - name: Race test
        working-directory: backend
        run: go test -race ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Windows source build
        working-directory: backend
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: Windows test graph compile
        working-directory: backend
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -exec=true ./...
      - name: Install govulncheck
        working-directory: backend
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Govulncheck
        working-directory: backend
        run: "\"$(go env GOPATH)/bin/govulncheck\" ./..."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - uses: ./.github/actions/setup-backend-native
      - name: Install
        working-directory: frontend
        run: npm ci --workspaces=false
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Architecture boundaries
        working-directory: frontend
        run: npm run test:architecture
      - name: Duplication budget
        working-directory: frontend
        env:
          FRONTEND_DUPLICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:duplication
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Async state ownership
        working-directory: frontend
        run: npm run test:async-race
      - name: Critical coverage floors
        working-directory: frontend
        run: npm run test:coverage
      - name: Changed behavior-owner coverage
        working-directory: frontend
        env:
          FRONTEND_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:coverage:changed
      - name: Browser smoke
        working-directory: frontend
        run: npm run test:e2e:smoke
      - name: Accessibility browser regression
        working-directory: frontend
        run: npm run test:e2e:accessibility
      - name: High-risk browser regression
        working-directory: frontend
        run: npm run test:e2e:high-risk
      - name: Real-backend browser test
        working-directory: frontend
        run: npm run test:e2e:real
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  mcp:
    name: MCP Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: Install
        working-directory: packages/mcp
        run: npm ci --workspaces=false
      - name: Lint
        working-directory: packages/mcp
        run: npm run lint
      - name: Format check
        working-directory: packages/mcp
        run: npm run format:check
      - name: Test
        working-directory: packages/mcp
        run: npm test
      - name: Build
        working-directory: packages/mcp
        run: npm run build
      - name: Production dependency audit
        working-directory: packages/mcp
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency audit
        working-directory: packages/mcp
        run: npm audit --audit-level=high
      - name: Pack dry run
        working-directory: packages/mcp
        run: npm pack --dry-run

  mcp-windows-private-config:
    name: MCP Windows Private Config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: Install
        working-directory: packages/mcp
        run: npm ci --workspaces=false
      - name: Verify Windows private-file ACL
        working-directory: packages/mcp
        run: npm run test:windows-acl

  docs:
    name: Docs Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject local Obsidian workspace files
        run: test -z "$(git ls-files docs/.obsidian)"

  npm-placeholder:
    name: NPM Placeholder Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Pack dry run
        working-directory: packages/npm-placeholder
        run: npm pack --dry-run

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build images
        run: docker compose build backend frontend
      - name: Trivy backend scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed aipermission-backend:latest
      - name: Trivy frontend scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed aipermission-frontend:latest
