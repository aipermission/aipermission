name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  security-hygiene:
    name: Security Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Secret scan
        run: node scripts/secret-scan.js
      - name: Line ending check
        run: node scripts/line-ending-check.js
      - name: Go toolchain consistency
        run: node scripts/go-toolchain-check.js
      - name: Maintenance budgets
        run: node scripts/maintenance-budget-check.js
      - name: Release version consistency
        run: node scripts/release-version.js --check
      - name: Native dependency inventory
        run: node scripts/native-dependency-check.js

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Race test
        working-directory: backend
        run: go test -race ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --workspaces=false
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Test
        working-directory: frontend
        run: npm test
      - name: End-to-end test
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

  mcp:
    name: MCP Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: Install
        working-directory: packages/mcp
        run: npm ci --workspaces=false
      - name: Test
        working-directory: packages/mcp
        run: npm test
      - name: Build
        working-directory: packages/mcp
        run: npm run build
      - name: Audit
        working-directory: packages/mcp
        run: npm audit --omit=dev --audit-level=moderate
      - name: Pack dry run
        working-directory: packages/mcp
        run: npm pack --dry-run

  docs:
    name: Docs Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject local Obsidian workspace files
        run: test -z "$(git ls-files docs/.obsidian)"

  npm-placeholder:
    name: NPM Placeholder Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Pack dry run
        working-directory: packages/npm-placeholder
        run: npm pack --dry-run

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build images
        run: docker compose build backend frontend
      - name: Trivy backend scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed aipermission-backend:latest
      - name: Trivy frontend scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed aipermission-frontend:latest
