name: Connector Conformance

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: "37 3 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-services:
    name: ClickHouse, Postgres, Valkey, RabbitMQ, and S3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum
      - uses: ./.github/actions/setup-backend-native
      - name: Run real-service connector conformance
        run: 'test -z "${MAKEFILES:-}" && make -f Makefile connector-conformance'
