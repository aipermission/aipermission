name: Connector Conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 3"

permissions:
  contents: read

jobs:
  real-services:
    name: Postgres, Valkey, RabbitMQ, and S3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - uses: ./.github/actions/setup-backend-native
      - name: Run real-service connector conformance
        run: make connector-conformance
