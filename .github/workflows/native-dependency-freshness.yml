name: Native Dependency Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: native-dependency-freshness
  cancel-in-progress: false

jobs:
  sqlcipher:
    name: SQLCipher upstream review signal
    if: github.repository == 'aipermission/aipermission'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - name: Compare reviewed native sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/native-dependency-freshness.js
