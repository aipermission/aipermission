map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $host $invalid_local_host {
  default 1;
  localhost 0;
  127.0.0.1 0;
}

server {
  listen 3210;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  if ($invalid_local_host) {
    return 403;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none';" always;

  error_page 413 = @json_payload_too_large;

  location = /api/connector-actions/local-run {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8080/api/connector-actions/local-run;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 1d;
  }

  location = /api/mcp/connector-actions/call {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8080/api/mcp/connector-actions/call;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 1d;
  }

  location = /api/backup/import {
    client_max_body_size 256m;
    error_page 413 = @database_upload_too_large;
    proxy_pass http://127.0.0.1:8080/api/backup/import;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 1d;
  }

  location ~ ^/api/connector-targets/[0-9]+/profiles/[0-9]+/restore$ {
    client_max_body_size 256m;
    error_page 413 = @connector_restore_too_large;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 1d;
  }

  location = /api/file-transfers/upload {
    client_max_body_size 528m;
    error_page 413 = @file_transfer_object_too_large;
    proxy_pass http://127.0.0.1:8080/api/file-transfers/upload;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 1d;
  }

  location = /api/file-transfers/upload-batch {
    client_max_body_size 1040m;
    error_page 413 = @file_transfer_batch_too_large;
    proxy_pass http://127.0.0.1:8080/api/file-transfers/upload-batch;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 1d;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1d;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8080/health;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-For "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location @json_payload_too_large {
    default_type application/json;
    return 413 '{"error":"Request body is too large. Maximum JSON request size is 1 MiB.","code":"request_body_too_large"}';
  }

  location @database_upload_too_large {
    default_type application/json;
    return 413 '{"error":"Uploaded database is too large. Maximum import size is 256 MiB."}';
  }

  location @connector_restore_too_large {
    default_type application/json;
    return 413 '{"error":"Uploaded restore file is too large. Maximum restore size is 256 MiB."}';
  }

  location @file_transfer_object_too_large {
    default_type application/json;
    return 413 '{"error":"Uploaded file is too large. Maximum file size is 512 MiB."}';
  }

  location @file_transfer_batch_too_large {
    default_type application/json;
    return 413 '{"error":"Upload batch is too large. Maximum batch size is 1 GiB."}';
  }
}
