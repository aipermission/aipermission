services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: aipermission
      POSTGRES_USER: aipermission
      POSTGRES_PASSWORD: conformance-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipermission -d aipermission"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    command: ["valkey-server", "--requirepass", "conformance-only"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "conformance-only", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
    environment:
      RABBITMQ_DEFAULT_USER: aipermission
      RABBITMQ_DEFAULT_PASS: conformance-only
    ports:
      - "127.0.0.1::15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: conformance-access
      MINIO_ROOT_PASSWORD: conformance-secret-key
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set fixture http://minio:9000 conformance-access conformance-secret-key
        mc mb --ignore-existing fixture/aipermission-conformance
