services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine@sha256:a4e8cf46e526a06f4f52d22f7fa8d07472b55d3c896d7ca3f159e249be38ae62
    environment:
      CLICKHOUSE_DB: aipermission
      CLICKHOUSE_USER: aipermission
      CLICKHOUSE_PASSWORD: conformance-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "aipermission", "--password", "conformance-only", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: aipermission
      POSTGRES_USER: aipermission
      POSTGRES_PASSWORD: conformance-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipermission -d aipermission"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    command: ["valkey-server", "--requirepass", "conformance-only"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "conformance-only", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
    environment:
      RABBITMQ_DEFAULT_USER: aipermission
      RABBITMQ_DEFAULT_PASS: conformance-only
    ports:
      - "127.0.0.1::15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Keep the service aliases used by the guarded release recipe; the S3 server is RustFS.
  minio:
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    environment:
      RUSTFS_ACCESS_KEY: conformance-access
      RUSTFS_SECRET_KEY: conformance-secret-key
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1::9000"
    tmpfs:
      - /data:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s

  minio-init:
    image: amazon/aws-cli:2.31.7@sha256:8173c3c7c71e25b0824025b90a85df6e24c696f646498dca9dd370ea446e4fc8
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: conformance-access
      AWS_SECRET_ACCESS_KEY: conformance-secret-key
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    command: ["--endpoint-url", "http://minio:9000", "s3api", "create-bucket", "--bucket", "aipermission-conformance"]
