protocols = imap lmtp
listen = *
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </run/protocols/tls.crt
ssl_key = </run/protocols/tls.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %n
mail_location = maildir:~/Maildir
log_path = /dev/stderr
info_log_path = /dev/stderr
passdb {
  driver = static
  args = password=conformance-only user=recipient
  username_filter = recipient fixture-login
}
userdb {
  driver = passwd
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0660
    user = postfix
    group = postfix
  }
}
namespace inbox {
  inbox = yes
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
}
