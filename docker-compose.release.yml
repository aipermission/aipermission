name: aipermission

services:
  backend:
    image: ghcr.io/aipermission/aipermission-backend:${AIPERMISSION_VERSION:-0.2.47}
    container_name: aipermission-backend
    restart: unless-stopped
    environment:
      AIPERMISSION_BACKEND_HOST: 127.0.0.1
      AIPERMISSION_BACKEND_PORT: 8080
      AIPERMISSION_DATA_PATH: /app/data/aipermission.db
      AIPERMISSION_GATEWAY_SECRET: ${AIPERMISSION_GATEWAY_SECRET:-}
      AIPERMISSION_FRONTEND_PORT: ${AIPERMISSION_FRONTEND_PORT:-3210}
      AIPERMISSION_ALLOWED_ORIGINS: ${AIPERMISSION_ALLOWED_ORIGINS:-}
    network_mode: "service:frontend"
    volumes:
      - aipermission_data:/app/data

  migration:
    profiles:
      - migrate
    image: ghcr.io/aipermission/aipermission-backend:${AIPERMISSION_VERSION:-0.2.47}
    container_name: aipermission-migration
    command: ["aipermission"]
    environment:
      AIPERMISSION_MIGRATION_MODE: "1"
      AIPERMISSION_MIGRATION_HOST: 127.0.0.1
      AIPERMISSION_MIGRATION_PORT: 3212
      AIPERMISSION_DATA_PATH: /app/data/aipermission.db
      AIPERMISSION_GATEWAY_SECRET: ${AIPERMISSION_GATEWAY_SECRET:-}
    network_mode: "service:migration-proxy"
    depends_on:
      - migration-proxy
    volumes:
      - aipermission_data:/app/data

  migration-proxy:
    profiles:
      - migrate
    image: ghcr.io/aipermission/aipermission-frontend:${AIPERMISSION_VERSION:-0.2.47}
    container_name: aipermission-migration-proxy
    ports:
      - "127.0.0.1:${AIPERMISSION_MIGRATION_FRONTEND_PORT:-3211}:3211"

  frontend:
    image: ghcr.io/aipermission/aipermission-frontend:${AIPERMISSION_VERSION:-0.2.47}
    container_name: aipermission-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIPERMISSION_FRONTEND_PORT:-3210}:3210"

volumes:
  aipermission_data:
